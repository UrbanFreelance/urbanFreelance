services:

  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    container_name: urbanlance_database
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: figes
      POSTGRES_PASSWORD: lawda

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U figes -d keycloak"]
      interval: 5s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: urbanlance_idp
    ports:
      - "8073:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: figes
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_PASSWORD: lawda
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
      dockerfile: ../api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_PORT: 5432
      REDIS_HOST: localhost
    stop_grace_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget --spider -q http://localhost/8080/autuator/health || exit 1"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 3
  auth-service:
    container_name: api-gateway
    build:
      context: ../auth-service
      dockerfile: ../auth-service/Dockerfile
    ports:
      - "8072:8072"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL","wget --spider -q http://localhost/8072/autuator/health || exit 1" ]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 3

  config-service:
    container_name: config-service
    build:
      context: ../config-service
      dockerfile: ../config-service/Dockerfile
    ports:
      - "8071:8071"
    stop_grace_period: 30s
    depends_on:
      vault:
        condition: service_healthy

  vault:
    image: vault
    container_name: urbanlance_vault
    ports:
      - "8200:8200"

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/data
    healthcheck:
      test: ["CMD-SHELL","redis-cli","-a","ping"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  eureka-service:
    container_name: discovery-service
    build:
      context: ../eureka-service
      dockerfile: ../eureka-service/Dockerfile
    ports:
      - "8070:8070"
    depends_on:
      config-service:
        condition: service_healthy

  user-service:
    container_name: user-service
    build:
      context: ../user
      dockerfile: ../user/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      eureka-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  job-service:
    container_name: job-service
    build:
      context: ../job
      dockerfile: ../job/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      eureka-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    build:
      context: .
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:prometheus.yaml
    command:
      - '--config.file=prometheus.yaml'
      - '--storage.tsbd.path=/prometheus'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL"]

volumes:
  postgres-data:
  redis-data:
  prometheus-data: