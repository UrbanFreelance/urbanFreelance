spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:http://localhost:8071"

  security:
    oauth2:
      resourceserver:
        keycloak:
          jwt:
            issue-uri: http://localhost:8073/realms/urbanlance_users_realm

  data:
    redis.port: ${REDIS_PORT}
    redis.host: ${REDIS_HOST}

auth.jwt.public.key: 


management:
  endpoints:
    web.exposure.include: health,info
  health.probes.enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    search-url:
      defaultZone: "http://localhost:8070/eureka"

server:
  port: 8080



